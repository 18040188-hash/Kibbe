<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let gender = null;  /* 'fem' | 'masc' | 'nb' */
let modIdx = 0;
let qIdx   = 0;
const answers = {};
const VENUS_TEST_KEY = 'venusTestProgressV2';
function saveTestProgress(){
  try{localStorage.setItem(VENUS_TEST_KEY,JSON.stringify({gender,modIdx,qIdx,answers,updatedAt:Date.now()}));}catch(e){}
}
function restoreTestProgress(){
  try{
    const raw=localStorage.getItem(VENUS_TEST_KEY); if(!raw)return false;
    const p=JSON.parse(raw); if(!p || !p.answers || !p.gender)return false;
    gender=p.gender; modIdx=Number.isInteger(p.modIdx)?p.modIdx:0; qIdx=Number.isInteger(p.qIdx)?p.qIdx:0;
    Object.assign(answers,p.answers); return true;
  }catch(e){return false;}
}
let selfieDataURL  = null;
let selfieAnalysis = null;
let sampleAPI      = null;

/* ═══════════════════════════════════════════════════════════
   GENDER SCREEN
═══════════════════════════════════════════════════════════ */
function renderGenderScreen() {
  document.getElementById('gender-screen').innerHTML = `
    <div class="gender-screen">
      <div class="section-icon">✦</div>
      <div class="section-label">Bienvenida / Bienvenido</div>
      <div class="section-title">
        El estilo no tiene género.<br>
        <em style="font-family:'Playfair Display',serif;
          font-weight:500;color:var(--wine)">
          ¿Cómo te identificas?
        </em>
      </div>
      <div class="section-sub" style="margin-top:8px">
        Para personalizar las prendas y referencias
        que más te encajan.
      </div>
      <div class="gender-grid">
        <div class="gender-opt" onclick="selectGender('fem',this)">
          <div class="gender-icon">◎</div>
          <div class="gender-name">Ella / Her</div>
        </div>
        <div class="gender-opt" onclick="selectGender('masc',this)">
          <div class="gender-icon">◈</div>
          <div class="gender-name">Él / Him</div>
        </div>
        <div class="gender-opt" onclick="selectGender('nb',this)">
          <div class="gender-icon">◐</div>
          <div class="gender-name">Elle / Them</div>
        </div>
      </div>
      <button class="gender-start" id="gender-start"
        onclick="startQuiz()">
        Comenzar el test →
      </button>
    </div>`;
}

function selectGender(g, el) {
  gender = g;
  document.querySelectorAll('.gender-opt')
    .forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('gender-start').classList.add('on');
}

function startQuiz() {
  if (!gender) return;
  document.getElementById('gender-screen').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  const restored = restoreTestProgress();
  if (!restored) { modIdx = 0; qIdx = 0; }
  renderQuestion();
}

/* ═══════════════════════════════════════════════════════════
   PROGRESS HELPERS
═══════════════════════════════════════════════════════════ */
function totalQuestions() {
  return getModules().reduce((s,m) => s + m.questions.length, 0);
}
function answeredCount() {
  return Object.keys(answers).length;
}
function updateProgress() {
  const mods   = getModules();
  const total  = totalQuestions();
  const done   = answeredCount();
  const pct    = Math.round((done / total) * 100);
  const labels = mods.map((m,i)=>'Módulo '+(i+1)+' de '+mods.length+' — '+m.label);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-label').textContent =
    (labels[modIdx] || '')+' · '+(done)+'/'+total+' observaciones';
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('sd'+i);
    if (!el) continue;
    el.className = 'section-dot' +
      (i < modIdx ? ' done' : i === modIdx ? ' active' : '');
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER QUESTION
═══════════════════════════════════════════════════════════ */
function renderQuestion() {
  const mods = getModules();
  const mod  = mods[modIdx];
  const q    = mod.questions[qIdx];
  const isFirst    = modIdx === 0 && qIdx === 0;
  const isFirstMod = qIdx === 0;
  let html = '';

  if (isFirstMod) {
    html += `
      <div class="section-intro">
        <span class="section-icon">${mod.icon}</span>
        <div class="section-label">${mod.label}</div>
        <div class="section-title">
          ${mod.title.replace('\n','<br>')}
        </div>
        <div class="section-sub">
          ${mod.sub.replace('\n','<br>')}
        </div>
      </div>`;
  }

  const gridCls = q.cols === 1 ? 'cols-1' : 'cols-2';
  html += `<div class="question-block">
    <div class="q-text">${q.text}</div>
    <div class="q-hint">${q.hint}</div>
    <div class="opt-grid ${gridCls}">`;

  q.opts.forEach(opt => {
    const sel = answers[q.id] === opt.id ? ' selected' : '';
    const isH = q.cols === 1;
    const vis  = opt.swatches
      ? `<div class="swatch-row">
          ${opt.swatches.map(c =>
            `<div class="swatch" style="background:${c}"></div>`
          ).join('')}
        </div>`
      : (opt.visual || '');

    if (isH) {
      html += `
        <div class="opt horizontal${sel}" data-question="${q.id}" aria-pressed="${answers[q.id] === opt.id}"
          onclick="selectOpt('${q.id}','${opt.id}')"
          role="button" tabindex="0">
          <div class="opt-visual">${vis}</div>
          <div class="opt-text">
            <div class="opt-name">${opt.name}</div>
            <div class="opt-desc">${opt.desc}</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="opt${sel}" data-question="${q.id}" aria-pressed="${answers[q.id] === opt.id}"
          onclick="selectOpt('${q.id}','${opt.id}')"
          role="button" tabindex="0">
          <div class="opt-visual">${vis}</div>
          <div class="opt-name">${opt.name}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>`;
    }
  });

  html += `</div></div>`;
  html += `
    <div class="nav-btns">
      ${!isFirst
        ? `<button class="btn-back" onclick="goBack()">← Atrás</button>`
        : ''}
      <button class="btn-next ${answers[q.id]?'on':''}"
        id="btn-next" onclick="goNext()">
        ${isLastQuestion() ? 'Siguiente paso ✦' : 'Continuar →'}
      </button>
    </div>`;

  document.getElementById('quiz-wrap').innerHTML = html;
  updateProgress();

  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key==='Enter'||e.key===' ') el.click();
    });
  });
}

function isLastQuestion() {
  const mods = getModules();
  const last = mods[mods.length - 1];
  return modIdx === mods.length - 1 &&
    qIdx === last.questions.length - 1;
}

function selectOpt(qId, optId) {
  answers[qId] = optId;
  saveTestProgress();
  renderQuestion();
}

function goNext() {
  const mods = getModules();
  const mod  = mods[modIdx];
  const q    = mod.questions[qIdx];
  if (!answers[q.id]) return;
  if (isLastQuestion()) {
    showSelfieModule();
    return;
  }
  if (qIdx < mod.questions.length - 1) {
    qIdx++;
  } else {
    if(modIdx===0 && !answers.kibbeTie && venusNeedsTieBreak()){
      venusShowTieBreak();saveTestProgress();return;
    }
    modIdx++;
    qIdx = 0;
  }
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function goBack() {
  const mods = getModules();
  if (qIdx > 0) {
    qIdx--;
  } else if (modIdx > 0) {
    modIdx--;
    qIdx = mods[modIdx].questions.length - 1;
  }
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function venusKibbeAnalysis(){
 const a=answers;
 const v=a.kb_vertical,f=a.kb_frame,soft=a.kb_flesh==='soft';
 let primary='soft-classic';
 // Transparent decision matrix: vertical line + frame are the primary observations.
 if(v==='long'&&f==='angular')primary=soft?'soft-dramatic':'dramatic';
 else if(v==='long'&&f==='blunt')primary='flamboyant-natural';
 else if(v==='long'&&f==='rounded')primary='soft-dramatic';
 else if(v==='compact'&&f==='angular')primary=soft?'soft-gamine':'gamine';
 else if(v==='compact'&&f==='rounded')primary=soft?'theatrical-romantic':'romantic';
 else if(v==='compact'&&f==='blunt')primary='soft-natural';
 else if(v==='moderate'&&f==='balanced')primary=soft?'soft-classic':'dramatic-classic';
 else if(f==='blunt')primary='soft-natural';
 else if(f==='rounded')primary='romantic';
 else if(f==='angular')primary='dramatic';
 const adjacent={
 dramatic:['dramatic-classic','soft-dramatic'],
 'soft-dramatic':['dramatic','theatrical-romantic'],
 'flamboyant-natural':['soft-natural','dramatic'],
 'soft-natural':['flamboyant-natural','soft-classic'],
 'dramatic-classic':['soft-classic','dramatic'],
 'soft-classic':['dramatic-classic','soft-natural'],
 gamine:['soft-gamine','dramatic'],
 'soft-gamine':['gamine','romantic'],
 romantic:['theatrical-romantic','soft-gamine'],
 'theatrical-romantic':['romantic','soft-dramatic']
 };
 const obs=['kb_vertical','kb_frame','kb_flesh','kb_shoulders','kb_scale','kb_balance'];
 const answered=obs.filter(k=>a[k]).length;
 const corroborating=[a.kb_balance==='dramatic'&&v==='long',a.kb_balance==='natural'&&f==='blunt',a.kb_balance==='romantic'&&f==='rounded',a.kb_balance==='balanced'&&f==='balanced'].filter(Boolean).length;
 const contradictions=[a.kb_balance==='dramatic'&&v==='compact',a.kb_balance==='natural'&&f==='angular',a.kb_balance==='romantic'&&f==='blunt',a.kb_balance==='balanced'&&v==='long'].filter(Boolean).length;
 const confidence=answered<4||contradictions>0?'bajo':corroborating>=1&&answered>=5?'alto':'medio';
 const score={};adjacent[primary].forEach((x,i)=>score[x]=2-i);
 return {primary,alternatives:adjacent[primary].map(x=>[x,score[x]]),confidence,answered,observations:obs.filter(k=>a[k]).map(k=>k+': '+a[k]),corroborating,contradictions};
}

 const d={temp:resolve(dims.temp),value:resolve(dims.value),chroma:resolve(dims.chroma)};
 const family=answers.cl_family||'unknown';
 const sub={
 spring:d.value==='light'?'Light Spring':d.chroma==='bright'?'Bright Spring':'True Spring',

 autumn:d.chroma==='soft'?'Soft Autumn':d.value==='deep'?'Deep Autumn':'True Autumn',
 winter:d.chroma==='bright'?'Bright Winter':d.value==='deep'?'Deep Winter':'True Winter'
 };
 const candidates={spring:['Light Spring','True Spring','Bright Spring'],summer:['Light Summer','True Summer','Soft Summer'],autumn:['Soft Autumn','True Autumn','Deep Autumn'],winter:['Deep Winter','True Winter','Bright Winter']};
 const primary=family==='unknown'?'Pendiente de confirmar':sub[family];
 const neighbors=family==='unknown'?['Completa la comparación de familias']:candidates[family].filter(x=>x!==primary);
 const consistent=Object.values(d).filter(x=>x!=='mixto'&&x!=='sin datos').length+(family!=='unknown'?1:0);
 return {dimensions:d,primary,neighbors,confidence:consistent>=4?'medio':'bajo'};
}
function venusEssenceAnalysis(){

   RESULT ENGINE
═══════════════════════════════════════════════════════════ */
function calcKibbeScores(){
 const h=answers.height,sh=answers.shoulders,w=answers.waist,t=answers.texture;
 const score={dramatic:0,'soft-dramatic':0,'flamboyant-natural':0,'soft-natural':0,'dramatic-classic':0,'soft-classic':0,gamine:0,'soft-gamine':0,romantic:0,'theatrical-romantic':0};
 if(h==='tall'){score.dramatic+=2;score['soft-dramatic']+=2;score['flamboyant-natural']+=1}
 if(h==='petite'){score.gamine+=2;score['soft-gamine']+=2}
 if(sh==='wide-sh'){score['flamboyant-natural']+=2;score['soft-natural']+=2;score['soft-dramatic']+=1}
 if(sh==='straight'){score.dramatic+=1;score['dramatic-classic']+=1}
 if(sh==='balanced'){score['soft-classic']+=2;score['dramatic-classic']+=2}
 if(sh==='wide-hip'){score.romantic+=1;score['soft-gamine']+=1}
 if(w==='yes'){score.romantic+=2;score['theatrical-romantic']+=1;score['soft-classic']+=1;score['soft-gamine']+=1}
 if(w==='no'){score.dramatic+=1;score['dramatic-classic']+=1}
 if(t==='sharp'){score.dramatic+=2;score['dramatic-classic']+=1;score['theatrical-romantic']+=1;score.gamine+=1}
 if(t==='soft'){score.romantic+=2;score['soft-dramatic']+=2;score['soft-natural']+=1;score['soft-gamine']+=2;score['theatrical-romantic']+=2}
 if(t==='mix'){score['soft-classic']+=1;score['flamboyant-natural']+=1;score['dramatic-classic']+=1;score.gamine+=1}
 if(t==='compact'){score.gamine+=2;score['soft-gamine']+=1}
 if(answers.kibbeTie==='defined'){score.dramatic+=2;score['dramatic-classic']+=1;score['flamboyant-natural']+=1}
 if(answers.kibbeTie==='soft'){score.romantic+=2;score['soft-gamine']+=1;score['soft-dramatic']+=1}
 if(answers.kibbeTie==='mixed'){score['soft-classic']+=1;score['dramatic-classic']+=1}
 return score;
}
function calcKibbe(){
 const scores=calcKibbeScores();
 return Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];
}
function calcSeason() {
  const sk = answers['skin']      || 'medium';
  const ut = answers['undertone'] || 'warm';
  const co = answers['contrast']  || 'medium';
  const re = answers['reaction']  || 'depends';
  if (ut==='warm'&&co==='high') return 'autumn-deep';
  if (ut==='warm'&&co==='low')  return 'autumn-soft';
  if (ut==='warm'&&re==='washes') return 'spring-warm';
  if (ut==='warm') return 'spring-true';
  if (ut==='cool'&&co==='high') return 'winter-true';
  if (ut==='cool'&&sk==='fair') return 'summer-cool';
  if (ut==='cool') return 'winter-soft';
  if (co==='high') return 'winter-clear';
  if (re==='flatters') return 'spring-light';
  return 'summer-soft';
}
function calcVibe() {
  const at = answers['attract']      || 'mystery';
  const vi = answers['vibe']         || 'ethereal';
  const ce = answers['color_energy'] || 'dark';
  if (at==='mystery'&&ce==='dark')     return 'dark-romantic';
  if (at==='power'&&ce==='dark')       return 'femme-fatale';
  if (at==='romantic'&&vi==='ethereal') return 'whimsical-goth';
  if (at==='romantic'&&vi==='classic') return 'romantic-academia';
  if (at==='free'&&vi==='rebel')       return 'indie-bohemian';
  if (at==='power'&&vi==='sensual')    return 'power-goth';
  if (vi==='classic') return 'dark-academia';
  return 'romantic-mystery';
}

/* ═══════════════════════════════════════════════════════════
   MOODBOARD RENDER
═══════════════════════════════════════════════════════════ */
function calcKibbe(){return venusKibbeAnalysis().primary;}
function calcSeason(){
 const n=venusColorAnalysis().primary;
 const map={'Light Spring':'spring-light','True Spring':'spring-true','Bright Spring':'spring-true','Light Summer':'summer-soft','True Summer':'summer-cool','Soft Summer':'summer-soft','Soft Autumn':'autumn-soft','True Autumn':'autumn-soft','Deep Autumn':'autumn-deep','Deep Winter':'winter-true','True Winter':'winter-true','Bright Winter':'winter-clear'};
 return map[n]||'autumn-soft';
}
function showMoodboard() {
  document.getElementById('selfie-wrap').style.display = 'none';
  document.getElementById('result-wrap').style.display = 'block';

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent  = '100%';
  document.getElementById('prog-label').textContent = 'Tu moodboard VÉNUS';
  for (let i=0; i<4; i++) {
    const el = document.getElementById('sd'+i);
    if (el) el.className = 'section-dot done';
  }

  const kibbe  = calcKibbe();
  const season = calcSeason();
  const vibe   = calcVibe();
  const kd = KIBBE_DATA[kibbe]   || KIBBE_DATA['soft-classic'];
  const sd = SEASON_DATA[season] || SEASON_DATA['autumn-soft'];
  const vd = VIBE_DATA[vibe]     || VIBE_DATA['romantic-mystery'];

  const isMasc = gender === 'masc';
  const pronoun = isMasc ? 'Tu' : 'Tu';

  /* palette swatches */
  const swatchHTML = sd.palette.map((c,i) =>
    `<div class="palette-swatch-block" style="background:${c}">
      <span>${sd.paletteNames[i]||''}</span>
    </div>`
  ).join('');

  /* garment sections */
  const garmentCards = Object.entries(kd.garments).map(([cat,items]) => {
    const icons = {
      tops:'👕', bottoms:'👖', outerwear:'🧥', accessories:'💍'
    };
    const labels = {
      tops: isMasc ? 'Torso' : 'Tops',
      bottoms: isMasc ? 'Parte baja' : 'Faldas / Pantalones',
      outerwear:'Outerwear',
      accessories: isMasc ? 'Accesorios' : 'Accesorios'
    };
    return `
      <div class="garment-card">
        <span class="garment-icon">${icons[cat]||'✦'}</span>
        <div class="garment-cat">${labels[cat]||cat}</div>
        <div class="garment-list">${items.join('<br>')}</div>
      </div>`;
  }).join('');

  /* proportion rules */
  const propRules = kd.proportionRules.map(r =>
    `<div class="proportion-rule">
      <div class="pr-dot"></div><span>${r}</span>
    </div>`
  ).join('');

  /* palette rules */
  const palRules = sd.rules.map((r,i) =>
    `<div class="palette-rule">
      <div class="palette-rule-dot"
        style="background:${sd.palette[i%sd.palette.length]}">
      </div>
      <span>${r}</span>
    </div>`
  ).join('');

  /* celeb cards */
  const celebCards = kd.celebs.map(c =>
    `<div class="celeb-card">
      <div class="celeb-avatar">${c.charAt(0)}</div>
      <div>
        <div class="celeb-name">${c}</div>
        <div class="celeb-why">
          Referente con tu tipo de silueta y proporciones
        </div>
      </div>
    </div>`
  ).join('');

  /* vibe elements */
  const vibeItems = vd.elements.map(e =>
    `<div class="proportion-rule">
      <div class="pr-dot"></div><span>${e}</span>
    </div>`
  ).join('');

  /* avoids */
  const avoidsHTML = kd.avoids.map(a =>
    `<div class="avoid-item">
      <span class="avoid-x">×</span><span>${a}</span>
    </div>`
  ).join('');

  /* selfie analysis block */
  let selfieHTML = '';
  if (selfieAnalysis) {
    const sa = selfieAnalysis;
    const featuresHTML = (sa.keyFeatures||[]).map(f =>
      `<div class="proportion-rule">
        <div class="pr-dot"></div><span>${f}</span>
      </div>`
    ).join('');
    const selfCelebs = (sa.celebrities||[]).map(c =>
      `<div class="celeb-card" style="margin-bottom:8px">
        <div class="celeb-avatar">${c.name.charAt(0)}</div>
        <div>
          <div class="celeb-name">${c.name}</div>
          <div class="celeb-why">${c.why}</div>
        </div>
      </div>`
    ).join('');
    const makeupCards = (sa.makeupTips||[]).map(t =>
      `<div class="makeup-card">
        <div class="makeup-area">${t.area}</div>
        <div class="makeup-tip">${t.tip}</div>
      </div>`
    ).join('');

    selfieHTML = `
      <div class="selfie-analysis-card">
        ${selfieDataURL
          ? `<img class="selfie-thumb"
              src="${selfieDataURL}" alt="Tu foto">`
          : ''}

          <div class="mb-section-icon">◉</div>
          <div class="mb-section-title">
            Análisis de tu rostro
          </div>
        </div>
        ${sa.faceShape
          ? `<div class="face-shape-badge">
              Forma de rostro: ${sa.faceShape}
            </div>`
          : ''}
        <div style="margin:12px 0">${featuresHTML}</div>
        <div class="mb-section-head" style="margin-top:14px">
          <div class="mb-section-icon"
            style="background:var(--plum)">✦</div>
          <div class="mb-section-title">
            Referentes con tus rasgos
          </div>
        </div>
        <div style="margin-top:10px">${selfCelebs}</div>
        <div class="mb-section-head" style="margin-top:14px">
          <div class="mb-section-icon"
            style="background:var(--plum)">◐</div>
          <div class="mb-section-title">
            ${isMasc
              ? 'Grooming y maquillaje'
              : 'Técnicas de maquillaje'}
            para tu rostro
          </div>
        </div>
        <div class="makeup-grid"
          style="margin-top:10px">${makeupCards}</div>
        ${sa.styleNote
          ? `<div class="quote-block" style="margin-top:14px">
              ${sa.styleNote}
            </div>`
          : ''}
      </div>`;
  }

  /* Unsplash image search URLs (keyword-based) */
  function unsplashURL(q, index = 0) {
    /* Curated editorial archive: stable Unsplash image IDs instead of the
       retired source.unsplash.com random endpoint. Captions remain result-specific. */
    const plates = [
      'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85',
      'https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=900&q=85',
      'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85'
    ];
    return plates[index % plates.length];
  }

  const moodImgs = vd.moodImages || [];
  const mosaicHTML = moodImgs.length >= 3
    ? `<div class="mosaic mosaic-3">
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[0].q, 0)}"
            alt="${moodImgs[0].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[0].cap}</div>
        </div>
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[1].q, 1)}"
            alt="${moodImgs[1].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[1].cap}</div>
        </div>
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[2].q, 2)}"
            alt="${moodImgs[2].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[2].cap}</div>
        </div>
      </div>`
    : '';

  document.getElementById('result-wrap').innerHTML = `

    <!-- COVER -->
    <div class="mb-cover">
      <div class="mb-cover-eyebrow">✦ Tu fórmula VÉNUS</div>
      <div class="mb-cover-name">${vd.name}</div>
      <div class="mb-cover-tagline">${vd.tagline}</div>
      <div class="formula-strip">
        <div class="formula-chip">
          <span class="chip-label">Silueta</span>
          ${kd.name}
        </div>
        <div class="formula-chip">
          <span class="chip-label">Paleta</span>
          ${sd.name}
        </div>
        <div class="formula-chip">
          <span class="chip-label">Vibe</span>
          ${vd.name}
        </div>
      </div>
    </div>
    ${venusResultExplanation()}
    ${venusMethodResults()}

    <!-- SELFIE ANALYSIS (if exists) -->
    ${selfieHTML}

    <!-- SECTION: SILUETA Y PROPORCIONES -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◈</div>
        <div class="mb-section-title">
          Tu silueta — ${kd.name}
        </div>
      </div>
      <div class="proportion-card">
        <div class="proportion-inner">
          <div class="proportion-figure">
            ${kd.svgFigure}
            <div class="proportion-figure-label">
              ${kd.figureDesc}
            </div>
          </div>
          <div class="proportion-rules">
            <div style="font-size:13px;color:#514a4c;
              margin-bottom:10px;line-height:1.5">
              ${kd.desc}
            </div>
            ${propRules}
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION: PRENDAS -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">👗</div>
        <div class="mb-section-title">
          Prendas que te favorecen
        </div>
      </div>
      <div class="garment-grid">${garmentCards}</div>
    </div>

    <!-- SECTION: EVITAR -->
    <div class="avoids-card">
      <div class="avoids-title">Mejor evitar</div>
      ${avoidsHTML}
    </div>

    <!-- SECTION: PALETA -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◐</div>
        <div class="mb-section-title">
          Tu paleta — ${sd.name}
        </div>
      </div>
      <div class="palette-strip">
        <div class="palette-swatches">${swatchHTML}</div>
        ${palRules}
      </div>
    </div>

    <!-- SECTION: MOODBOARD IMAGES -->
    ${mosaicHTML ? `
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◎</div>
        <div class="mb-section-title">
          Referencias de estilo
        </div>
      </div>
      ${mosaicHTML}
    </div>` : ''}

    <!-- SECTION: ENERGÍA / VIBE -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">☽</div>
        <div class="mb-section-title">
          Tu energía — ${vd.name}
        </div>
      </div>
      <div class="proportion-card">
        <div style="font-size:13px;color:#514a4c;
          line-height:1.5;margin-bottom:12px">
          ${vd.desc}
        </div>
        ${vibeItems}
      </div>
    </div>

    <!-- SECTION: REFERENCIAS CELEBS -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">✦</div>
        <div class="mb-section-title">
          Referencias con tu silueta
        </div>
      </div>
      <div class="celeb-cards">${celebCards}</div>
    </div>

    <!-- QUOTE -->
    <div class="quote-block">${vd.quote}</div>

    <!-- ACTIONS -->
    <div class="result-actions">
      <button class="btn-restart" onclick="restart()">
        ← Hacer el test de nuevo
      </button>
      <a class="btn-home" href="index.html">
        Ir a VÉNUS →
      </a>
    </div>
  `;

  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ═══════════════════════════════════════════════════════════
   RESTART
═══════════════════════════════════════════════════════════ */
function restart() {
  modIdx = 0; qIdx = 0;
  gender = null;
  selfieDataURL  = null;
  selfieAnalysis = null;
  Object.keys(answers).forEach(k => delete answers[k]);

  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('selfie-wrap').style.display = 'none';
  document.getElementById('quiz-wrap').style.display   = 'none';
  document.getElementById('gender-screen').style.display = 'block';

  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-pct').textContent  = '0%';
  document.getElementById('prog-label').textContent = 'Elige tu perfil';
  for (let i=0; i<4; i++) {
    const el = document.getElementById('sd'+i);
    if (el) el.className = 'section-dot'+(i===0?' active':'');
  }
  renderGenderScreen();
  window.scrollTo({ top:0, behavior:'smooth' });
}
