<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉNUS — Descubre tu fórmula de estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500
        &family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
  rel="stylesheet"
>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --wine:   #641f38;
  --plum:   #40203f;
  --wine-lt:#fdf0f4;
  --wine-md:#e8b0c0;
  --gold:   #c9a66b;
  --cream:  #f6f0e8;
  --black:  #171516;
  --white:  #fffaf6;
  --muted:  #7a6e70;
  --border: rgba(23,21,22,.12);
  --r:      14px;
}

/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--black);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NAV ─────────────────────────────────────────────────── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(246,240,232,.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: 4px;
  font-weight: 500;
  color: var(--black);
  text-decoration: none;
}
.nav-home {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 30px;
  transition: .2s;
}
.nav-home:hover {
  background: var(--black);
  color: var(--white);
}

/* ── LAYOUT ──────────────────────────────────────────────── */
main {
  max-width: 560px;
  margin: 0 auto;
  padding: 100px 24px 80px;
  min-height: 100vh;
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress-wrap {
  margin-bottom: 32px;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: .5px;
}
.progress-track {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--wine);
  border-radius: 2px;
  transition: width .4s ease;
}
.section-dots {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.section-dot {
  flex: 1;
  height: 3px;
  border-radius: 3px;
  background: var(--border);
  transition: background .3s;
}
.section-dot.active { background: var(--wine); }
.section-dot.done   { background: var(--wine-md); }

/* ── SECTION HEADER ──────────────────────────────────────── */
.section-intro {
  text-align: center;
  padding: 20px 0 32px;
}
.section-icon {
  font-size: 32px;
  margin-bottom: 12px;
  display: block;
}
.section-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--wine);
  margin-bottom: 8px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 500;
  line-height: 1.15;
  margin-bottom: 10px;
}
.section-sub {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
  max-width: 400px;
  margin: 0 auto;
}

/* ── QUESTION ────────────────────────────────────────────── */
.question-block { margin-bottom: 36px; }
.q-text {
  font-size: 17px;
  font-weight: 500;
  line-height: 1.4;
  margin-bottom: 6px;
}
.q-hint {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 16px;
}

/* ── OPTIONS GRID ────────────────────────────────────────── */
.opt-grid {
  display: grid;
  gap: 10px;
}
.opt-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.opt-grid.cols-1 { grid-template-columns: 1fr; }

.opt {
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px 14px 13px;
  cursor: pointer;
  background: var(--white);
  transition: border-color .18s, background .18s;
  text-align: center;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.opt:hover { border-color: var(--wine-md); background: var(--wine-lt); }
.opt.selected {
  border-color: var(--wine);
  background: var(--wine-lt);
}
.opt.selected::after {
  content: '✦';
  position: absolute;
  top: 8px; right: 10px;
  font-size: 9px;
  color: var(--wine);
}

/* visual inside opt */
.opt-visual {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 70px;
  margin-bottom: 10px;
}
.opt-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--black);
  margin-bottom: 3px;
  line-height: 1.3;
}
.opt-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

/* color swatch option */
.swatch-row {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,.08);
  flex-shrink: 0;
}

/* horizontal option (for single-col) */
.opt.horizontal {
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
}
.opt.horizontal .opt-visual {
  height: auto;
  margin: 0;
  flex-shrink: 0;
  width: 40px;
}
.opt.horizontal .opt-text { flex: 1; }
.opt.horizontal .opt-name { margin-bottom: 2px; }

/* ── NAVIGATION ──────────────────────────────────────────── */
.nav-btns {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-back {
  background: none;
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 12px 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
  transition: .2s;
}
.btn-back:hover { border-color: var(--black); color: var(--black); }
.btn-next {
  flex: 1;
  background: var(--wine);
  border: none;
  border-radius: 30px;
  padding: 13px 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  opacity: .35;
  pointer-events: none;
  transition: opacity .2s;
}
.btn-next.on {
  opacity: 1;
  pointer-events: auto;
}

/* ── RESULT ──────────────────────────────────────────────── */
.result-wrap { display: none; }
.result-header {
  text-align: center;
  padding: 16px 0 28px;
}
.result-badge {
  display: inline-block;
  background: var(--wine-lt);
  color: var(--wine);
  border: 1px solid var(--wine-md);
  border-radius: 20px;
  font-size: 11px;
  letter-spacing: 1.5px;
  padding: 5px 16px;
  margin-bottom: 16px;
  text-transform: uppercase;
}
.result-name {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 500;
  font-style: italic;
  line-height: 1.1;
  margin-bottom: 6px;
}
.result-tagline {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}
.result-desc {
  font-size: 15px;
  line-height: 1.7;
  color: #514a4c;
  margin-bottom: 24px;
}

/* formula chips */
.formula-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 28px;
}
.formula-chip {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip-label {
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.chip-val {
  font-weight: 500;
  color: var(--wine);
}

/* result sections */
.result-section {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 14px;
}
.result-section-title {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wine);
  margin-bottom: 12px;
}
.tip-list { list-style: none; }
.tip-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: #514a4c;
  line-height: 1.5;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.tip-item:last-child { border-bottom: none; }
.tip-icon {
  color: var(--wine);
  flex-shrink: 0;
  margin-top: 2px;
  font-size: 13px;
}
.avoid-icon { color: #b07020; }
.result-section.avoids .result-section-title { color: #b07020; }

/* color palette result */
.palette-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.palette-block {
  flex: 1;
  min-width: 40px;
  height: 48px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,.08);
}
.palette-names {
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
}

/* celeb pills */
.celeb-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.celeb-pill {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  padding: 5px 12px;
  color: var(--black);
}

/* restart */
.btn-restart {
  width: 100%;
  background: none;
  border: 1.5px solid var(--wine);
  border-radius: 30px;
  padding: 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--wine);
  cursor: pointer;
  margin-top: 8px;
  transition: .2s;
}
.btn-restart:hover {
  background: var(--wine);
  color: #fff;
}
.btn-home {
  display: block;
  width: 100%;
  text-align: center;
  background: var(--black);
  border: none;
  border-radius: 30px;
  padding: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  margin-top: 10px;
  text-decoration: none;
  transition: .2s;
}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 480px) {
  main { padding: 90px 16px 60px; }
  .section-title { font-size: 24px; }
  .opt-grid.cols-2 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 360px) {
  .opt-grid.cols-2 { grid-template-columns: 1fr; }
}
</style>
</head>
