
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉNUS — Descubre tu fórmula de estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;1,400
        &family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
  rel="stylesheet"
>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --wine:    #641f38;
  --plum:    #40203f;
  --wine-lt: #fdf0f4;
  --wine-md: #e8b0c0;
  --gold:    #c9a66b;
  --cream:   #f6f0e8;
  --black:   #171516;
  --white:   #fffaf6;
  --muted:   #7a6e70;
  --border:  rgba(23,21,22,.12);
  --r:       14px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--black);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NAV ─────────────────────────────────────────────────── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(246,240,232,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: 4px;
  font-weight: 500;
  color: var(--black);
  text-decoration: none;
}
.nav-home {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 30px;
  transition: .2s;
}
.nav-home:hover {
  background: var(--black);
  color: var(--white);
}

/* ── LAYOUT ──────────────────────────────────────────────── */
main {
  max-width: 600px;
  margin: 0 auto;
  padding: 100px 20px 80px;
  min-height: 100vh;
}

/* ── PROGRESS ────────────────────────────────────────────── */
.progress-wrap { margin-bottom: 28px; }
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: .5px;
}
.progress-track {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--wine);
  border-radius: 2px;
  transition: width .4s ease;
}
.section-dots {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.section-dot {
  flex: 1;
  height: 3px;
  border-radius: 3px;
  background: var(--border);
  transition: background .3s;
}
.section-dot.active { background: var(--wine); }
.section-dot.done   { background: var(--wine-md); }

/* ── SECTION HEADER ──────────────────────────────────────── */
.section-intro {
  text-align: center;
  padding: 0 0 28px;
}
.section-icon {
  font-size: 30px;
  margin-bottom: 10px;
  display: block;
}
.section-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--wine);
  margin-bottom: 8px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 10px;
}
.section-sub {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  max-width: 420px;
  margin: 0 auto;
}

/* ── GENDER SELECTOR ─────────────────────────────────────── */
.gender-screen {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}
.gender-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
}
.gender-opt {
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 22px 12px;
  cursor: pointer;
  background: var(--white);
  transition: .2s;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.gender-opt:hover {
  border-color: var(--wine);
  background: var(--wine-lt);
}
.gender-opt.selected {
  border-color: var(--wine);
  background: var(--wine-lt);
}
.gender-icon { font-size: 28px; margin-bottom: 8px; }
.gender-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--black);
}
.gender-start {
  margin-top: 28px;
  background: var(--wine);
  border: none;
  border-radius: 30px;
  padding: 14px 32px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  opacity: .35;
  pointer-events: none;
  transition: opacity .2s;
}
.gender-start.on {
  opacity: 1;
  pointer-events: auto;
}

/* ── QUESTION ────────────────────────────────────────────── */
.question-block { margin-bottom: 32px; }
.q-text {
  font-size: 17px;
  font-weight: 500;
  line-height: 1.4;
  margin-bottom: 6px;
}
.q-hint {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 16px;
}
.opt-grid {
  display: grid;
  gap: 10px;
}
.opt-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.opt-grid.cols-1 { grid-template-columns: 1fr; }
.opt {
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px 12px 12px;
  cursor: pointer;
  background: var(--white);
  transition: .18s;
  text-align: center;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.opt:hover {
  border-color: var(--wine-md);
  background: var(--wine-lt);
}
.opt.selected {
  border-color: var(--wine);
  background: var(--wine-lt);
}
.opt.selected::after {
  content: '✦';
  position: absolute;
  top: 8px; right: 10px;
  font-size: 9px;
  color: var(--wine);
}
.opt-visual {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 66px;
  margin-bottom: 9px;
}
.opt-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--black);
  margin-bottom: 3px;
  line-height: 1.3;
}
.opt-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}
.swatch-row {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.swatch {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,.08);
  flex-shrink: 0;
}
.opt.horizontal {
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.opt.horizontal .opt-visual {
  height: auto;
  margin: 0;
  flex-shrink: 0;
  width: 38px;
}
.opt.horizontal .opt-text { flex: 1; }
.opt.horizontal .opt-name { margin-bottom: 2px; }

/* ── NAV BUTTONS ─────────────────────────────────────────── */
.nav-btns {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-back {
  background: none;
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 12px 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
  transition: .2s;
}
.btn-back:hover { border-color: var(--black); color: var(--black); }
.btn-next {
  flex: 1;
  background: var(--wine);
  border: none;
  border-radius: 30px;
  padding: 13px 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  opacity: .35;
  pointer-events: none;
  transition: opacity .2s;
}
.btn-next.on {
  opacity: 1;
  pointer-events: auto;
}

/* ── SELFIE MODULE ───────────────────────────────────────── */
.selfie-wrap { display: none; }
.selfie-upload-area {
  border: 2px dashed var(--wine-md);
  border-radius: var(--r);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  background: var(--white);
  transition: .2s;
  position: relative;
}
.selfie-upload-area:hover,
.selfie-upload-area.drag {
  border-color: var(--wine);
  background: var(--wine-lt);
}
.selfie-upload-area input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.upload-icon { font-size: 28px; margin-bottom: 8px; }
.upload-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--black);
  margin-bottom: 4px;
}
.upload-sub { font-size: 12px; color: var(--muted); }
.selfie-preview-wrap {
  display: none;
  margin-top: 14px;
  position: relative;
}
.selfie-preview-wrap img {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}
.selfie-remove {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(23,21,22,.6);
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px; height: 30px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.selfie-privacy {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.selfie-skip {
  background: none;
  border: none;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  text-decoration: underline;
  padding: 8px 0;
  display: block;
  margin: 10px auto 0;
}
.analysis-state {
  display: none;
  text-align: center;
  padding: 28px 0;
}
.analysis-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--wine);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.analysis-label { font-size: 14px; color: var(--muted); }

/* ── MOODBOARD RESULT ────────────────────────────────────── */
.result-wrap { display: none; }

/* cover header */
.mb-cover {
  background: var(--black);
  border-radius: 18px;
  padding: 32px 24px 28px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.mb-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at 70% 30%,
    rgba(100,31,56,.5) 0%,
    transparent 70%
  );
}
.mb-cover-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--wine-md);
  margin-bottom: 10px;
  position: relative;
}
.mb-cover-name {
  font-family: 'Playfair Display', serif;
  font-size: 34px;
  font-weight: 500;
  font-style: italic;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 8px;
  position: relative;
}
.mb-cover-tagline {
  font-size: 12px;
  color: rgba(255,255,255,.55);
  letter-spacing: 1px;
  position: relative;
}
.formula-strip {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 18px;
  position: relative;
}
.formula-chip {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 11px;
  color: rgba(255,255,255,.8);
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip-label {
  color: var(--wine-md);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* section heading */
.mb-section {
  margin-bottom: 16px;
}
.mb-section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.mb-section-icon {
  width: 28px; height: 28px;
  background: var(--wine);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: white;
  flex-shrink: 0;
}
.mb-section-title {
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wine);
  font-weight: 500;
}

/* proportion diagram card */
.proportion-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}
.proportion-inner {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 20px;
  align-items: start;
}
.proportion-figure {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.proportion-figure svg {
  display: block;
  margin: 0 auto;
}
.proportion-figure-label {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
}
.proportion-rules { flex: 1; }
.proportion-rule {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.5;
  color: #514a4c;
  align-items: flex-start;
}
.proportion-rule:last-child { border-bottom: none; }
.pr-dot {
  width: 6px; height: 6px;
  background: var(--wine);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 6px;
}

/* garment chips grid */
.garment-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.garment-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
}
.garment-icon {
  font-size: 22px;
  margin-bottom: 8px;
  display: block;
}
.garment-cat {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wine);
  margin-bottom: 6px;
}
.garment-list {
  font-size: 12px;
  color: #514a4c;
  line-height: 1.8;
}

/* palette strip */
.palette-strip {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 16px;
}
.palette-swatches {
  display: flex;
  gap: 0;
  border-radius: 10px;
  overflow: hidden;
  height: 56px;
  margin-bottom: 12px;
}
.palette-swatch-block {
  flex: 1;
  position: relative;
}
.palette-swatch-block span {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: rgba(255,255,255,.7);
  white-space: nowrap;
  letter-spacing: .5px;
}
.palette-rule {
  font-size: 12px;
  color: #514a4c;
  line-height: 1.7;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.palette-rule:last-child { border-bottom: none; }
.palette-rule-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}

/* image moodboard mosaic */
.mosaic {
  display: grid;
  gap: 6px;
  margin-bottom: 16px;
}
.mosaic.mosaic-2 {
  grid-template-columns: 1fr 1fr;
}
.mosaic.mosaic-3 {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.mosaic.mosaic-3 .mosaic-item:first-child {
  grid-row: 1 / 3;
}
.mosaic-item {
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  background: #1a1015;
  min-height: 130px;
}
.mosaic-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: .85;
  transition: opacity .3s;
}
.mosaic-item:hover img { opacity: 1; }
.mosaic-cap {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 20px 10px 8px;
  background: linear-gradient(
    transparent, rgba(23,21,22,.75)
  );
  font-size: 11px;
  color: rgba(255,255,255,.85);
  line-height: 1.4;
}

/* reference celebrities */
.celeb-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}
.celeb-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.celeb-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--cream);
  border: 1.5px solid var(--wine-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  overflow: hidden;
}
.celeb-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.celeb-name {
  font-weight: 500;
  font-size: 14px;
  color: var(--black);
  margin-bottom: 3px;
}
.celeb-why {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

/* makeup tips */
.makeup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.makeup-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
}
.makeup-area {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wine);
  margin-bottom: 6px;
}
.makeup-tip {
  font-size: 12px;
  color: #514a4c;
  line-height: 1.6;
}

/* selfie analysis block */
.selfie-analysis-card {
  background: var(--wine-lt);
  border: 1.5px solid var(--wine-md);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 16px;
}
.selfie-thumb {
  width: 72px; height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--wine);
  display: block;
  margin: 0 auto 14px;
}
.face-shape-badge {
  display: inline-block;
  background: var(--wine);
  color: white;
  border-radius: 20px;
  font-size: 11px;
  padding: 4px 14px;
  margin: 0 auto 14px;
  display: table;
}

/* avoids */
.avoids-card {
  background: #fff8f0;
  border: 1px solid #e8d8c0;
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 16px;
}
.avoids-title {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #b07020;
  margin-bottom: 10px;
}
.avoid-item {
  display: flex;
  gap: 10px;
  font-size: 13px;
  color: #514a4c;
  padding: 6px 0;
  border-bottom: 1px solid rgba(0,0,0,.06);
  line-height: 1.5;
  align-items: flex-start;
}
.avoid-item:last-child { border-bottom: none; }
.avoid-x {
  color: #b07020;
  flex-shrink: 0;
  margin-top: 1px;
}

/* quote */
.quote-block {
  border-left: 3px solid var(--wine);
  padding: 12px 16px;
  margin: 16px 0;
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-style: italic;
  color: var(--black);
  line-height: 1.6;
  background: var(--white);
  border-radius: 0 var(--r) var(--r) 0;
}

/* actions */
.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}
.btn-restart {
  width: 100%;
  background: none;
  border: 1.5px solid var(--wine);
  border-radius: 30px;
  padding: 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--wine);
  cursor: pointer;
  transition: .2s;
}
.btn-restart:hover {
  background: var(--wine);
  color: #fff;
}
.btn-home {
  display: block;
  text-align: center;
  background: var(--black);
  border: none;
  border-radius: 30px;
  padding: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  transition: .2s;
}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 420px) {
  main { padding: 90px 14px 60px; }
  .section-title { font-size: 22px; }

  gender = g;

  document.getElementById('gender-start').classList.add('on');
}

/* ═══════════════════════════════════════════════════════════
   PROGRESS HELPERS
═══════════════════════════════════════════════════════════ */
function totalQuestions() {
  return getModules().reduce((s,m) => s + m.questions.length, 0);
}
function answeredCount() {
  return Object.keys(answers).length;
}
function updateProgress() {
  const mods   = getModules();
  const total  = totalQuestions();
  const done   = answeredCount();
  const pct    = Math.round((done / total) * 100);
  const labels = [
    'Módulo 1 de 3 — Tu silueta',
    'Módulo 2 de 3 — Tu paleta',
    'Módulo 3 de 3 — Tu energía'
  ];
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-label').textContent =
    labels[modIdx] || '';
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('sd'+i);
    if (!el) continue;
    el.className = 'section-dot' +
      (i < modIdx ? ' done' : i === modIdx ? ' active' : '');
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER QUESTION
═══════════════════════════════════════════════════════════ */
function renderQuestion() {
  const mods = getModules();
  const mod  = mods[modIdx];
  const q    = mod.questions[qIdx];
  const isFirst    = modIdx === 0 && qIdx === 0;
  const isFirstMod = qIdx === 0;
  let html = '';

  if (isFirstMod) {
    html += `
      <div class="section-intro">
        <span class="section-icon">${mod.icon}</span>
        <div class="section-label">${mod.label}</div>
        <div class="section-title">
          ${mod.title.replace('\n','<br>')}
        </div>
        <div class="section-sub">
          ${mod.sub.replace('\n','<br>')}
        </div>
      </div>`;
  }

  const gridCls = q.cols === 1 ? 'cols-1' : 'cols-2';
  html += `<div class="question-block">
    <div class="q-text">${q.text}</div>
    <div class="q-hint">${q.hint}</div>
    <div class="opt-grid ${gridCls}">`;

  q.opts.forEach(opt => {
    const sel = answers[q.id] === opt.id ? ' selected' : '';
    const isH = q.cols === 1;
    const vis  = opt.swatches
      ? `<div class="swatch-row">
          ${opt.swatches.map(c =>
            `<div class="swatch" style="background:${c}"></div>`
          ).join('')}
        </div>`
      : (opt.visual || '');

    if (isH) {
      html += `
        <div class="opt horizontal${sel}"
          onclick="selectOpt('${q.id}','${opt.id}')"
          role="button" tabindex="0">
          <div class="opt-visual">${vis}</div>
          <div class="opt-text">
            <div class="opt-name">${opt.name}</div>
            <div class="opt-desc">${opt.desc}</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="opt${sel}"
          onclick="selectOpt('${q.id}','${opt.id}')"
          role="button" tabindex="0">
          <div class="opt-visual">${vis}</div>
          <div class="opt-name">${opt.name}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>`;
    }
  });

  html += `</div></div>`;
  html += `
    <div class="nav-btns">
      ${!isFirst
        ? `<button class="btn-back" onclick="goBack()">← Atrás</button>`
        : ''}
      <button class="btn-next ${answers[q.id]?'on':''}"
        id="btn-next" onclick="goNext()">
        ${isLastQuestion() ? 'Siguiente paso ✦' : 'Continuar →'}
      </button>
    </div>`;

  document.getElementById('quiz-wrap').innerHTML = html;
  updateProgress();

  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key==='Enter'||e.key===' ') el.click();
    });
  });
}

function isLastQuestion() {
  const mods = getModules();
  const last = mods[mods.length - 1];
  return modIdx === mods.length - 1 &&
    qIdx === last.questions.length - 1;
}

function selectOpt(qId, optId) {
  answers[qId] = optId;
  renderQuestion();
}

function goNext() {
  const mods = getModules();
  const mod  = mods[modIdx];
  const q    = mod.questions[qIdx];
  if (!answers[q.id]) return;
  if (isLastQuestion()) {
    showSelfieModule();
    return;
  }
  if (qIdx < mod.questions.length - 1) {
    qIdx++;
  } else {
    modIdx++;
    qIdx = 0;
  }
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function goBack() {
  const mods = getModules();
  if (qIdx > 0) {
    qIdx--;
  } else if (modIdx > 0) {
    modIdx--;
    qIdx = mods[modIdx].questions.length - 1;
  }
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function handleDrop(e) {

    .classList.remove('drag');

  if (f && f.type.startsWith('image/')) loadImageFile(f);

function loadImageFile(file) {
  const r = new FileReader();
  r.onload = ev => {
    selfieDataURL = ev.target.result;
    document.getElementById('selfie-preview').src =
      selfieDataURL;
    document.getElementById('preview-wrap')
      .style.display = 'block';
    document.getElementById('upload-area')
      .style.display = 'none';

  r.readAsDataURL(file);

/* ═══════════════════════════════════════════════════════════
   RESULT ENGINE
═══════════════════════════════════════════════════════════ */
function calcKibbe() {
  const h  = answers['height']    || 'medium';
  const sh = answers['shoulders'] || 'straight';
  const w  = answers['waist']     || 'slight';
  const t  = answers['texture']   || 'mix';
  if (h==='tall'&&(sh==='straight'||sh==='wide-sh')&&t==='sharp')
    return 'dramatic';
  if (h==='tall'&&t==='soft') return 'soft-dramatic';
  if (h==='petite'&&t==='compact') return 'gamine';
  if (h==='petite'&&t==='soft') return 'soft-gamine';
  if (sh==='balanced'&&w==='yes') return 'soft-classic';
  if (sh==='balanced'&&w!=='yes') return 'dramatic-classic';
  if (t==='soft'&&w==='yes') return 'romantic';
  if (t==='soft') return 'theatrical-romantic';
  if (sh==='wide-sh'&&t!=='sharp') return 'flamboyant-natural';
  if (sh==='wide-sh') return 'soft-natural';
  return 'soft-classic';
}
function calcSeason() {
  const sk = answers['skin']      || 'medium';
  const ut = answers['undertone'] || 'warm';
  const co = answers['contrast']  || 'medium';
  const re = answers['reaction']  || 'depends';
  if (ut==='warm'&&co==='high') return 'autumn-deep';
  if (ut==='warm'&&co==='low')  return 'autumn-soft';
  if (ut==='warm'&&re==='washes') return 'spring-warm';
  if (ut==='warm') return 'spring-true';
  if (ut==='cool'&&co==='high') return 'winter-true';
  if (ut==='cool'&&sk==='fair') return 'summer-cool';
  if (ut==='cool') return 'winter-soft';
  if (co==='high') return 'winter-clear';
  if (re==='flatters') return 'spring-light';
  return 'summer-soft';
}
function calcVibe() {
  const at = answers['attract']      || 'mystery';
  const vi = answers['vibe']         || 'ethereal';
  const ce = answers['color_energy'] || 'dark';
  if (at==='mystery'&&ce==='dark')     return 'dark-romantic';
  if (at==='power'&&ce==='dark')       return 'femme-fatale';
  if (at==='romantic'&&vi==='ethereal') return 'whimsical-goth';
  if (at==='romantic'&&vi==='classic') return 'romantic-academia';
  if (at==='free'&&vi==='rebel')       return 'indie-bohemian';
  if (at==='power'&&vi==='sensual')    return 'power-goth';
  if (vi==='classic') return 'dark-academia';
  return 'romantic-mystery';
}

/* ═══════════════════════════════════════════════════════════
   MOODBOARD RENDER
═══════════════════════════════════════════════════════════ */
function showMoodboard() {
  document.getElementById('selfie-wrap').style.display = 'none';
  document.getElementById('result-wrap').style.display = 'block';

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent  = '100%';
  document.getElementById('prog-label').textContent = 'Tu moodboard VÉNUS';
  for (let i=0; i<4; i++) {
    const el = document.getElementById('sd'+i);
    if (el) el.className = 'section-dot done';
  }

  const kibbe  = calcKibbe();
  const season = calcSeason();
  const vibe   = calcVibe();
  const kd = KIBBE_DATA[kibbe]   || KIBBE_DATA['soft-classic'];
  const sd = SEASON_DATA[season] || SEASON_DATA['autumn-soft'];
  const vd = VIBE_DATA[vibe]     || VIBE_DATA['romantic-mystery'];
  
  // Puente VÉNUS → Glow Up: guarda la fórmula estructurada
  // para que Glow Up pueda recibirla automáticamente.
  try {
    localStorage.setItem('venusGlowUpProfile', JSON.stringify({
      version: 1,
      gender,
      kibbe: kd.name,
      season: sd.name,
      vibe: vd.name,
      formula: `${kd.name} · ${sd.name} · ${vd.name}`,
      createdAt: new Date().toISOString()
    }));
  } catch (e) {
    console.warn('No se pudo guardar el puente VÉNUS → Glow Up:', e);
  }

  const isMasc = gender === 'masc';
  const pronoun = isMasc ? 'Tu' : 'Tu';

  /* palette swatches */
  const swatchHTML = sd.palette.map((c,i) =>
    `<div class="palette-swatch-block" style="background:${c}">
      <span>${sd.paletteNames[i]||''}</span>
    </div>`
  ).join('');

  /* garment sections */
  const garmentCards = Object.entries(kd.garments).map(([cat,items]) => {
    const icons = {
      tops:'👕', bottoms:'👖', outerwear:'🧥', accessories:'💍'
    };
    const labels = {
      tops: isMasc ? 'Torso' : 'Tops',
      bottoms: isMasc ? 'Parte baja' : 'Faldas / Pantalones',
      outerwear:'Outerwear',
      accessories: isMasc ? 'Accesorios' : 'Accesorios'
    };
    return `
      <div class="garment-card">
        <span class="garment-icon">${icons[cat]||'✦'}</span>
        <div class="garment-cat">${labels[cat]||cat}</div>
        <div class="garment-list">${items.join('<br>')}</div>
      </div>`;
  }).join('');

  /* proportion rules */
  const propRules = kd.proportionRules.map(r =>
    `<div class="proportion-rule">
      <div class="pr-dot"></div><span>${r}</span>
    </div>`
  ).join('');

  /* palette rules */
  const palRules = sd.rules.map((r,i) =>
    `<div class="palette-rule">
      <div class="palette-rule-dot"
        style="background:${sd.palette[i%sd.palette.length]}">
      </div>
      <span>${r}</span>
    </div>`
  ).join('');

  /* celeb cards */
  const celebCards = kd.celebs.map(c =>
    `<div class="celeb-card">
      <div class="celeb-avatar">${c.charAt(0)}</div>
      <div>
        <div class="celeb-name">${c}</div>
        <div class="celeb-why">
          Referente con tu tipo de silueta y proporciones
        </div>
      </div>
    </div>`
  ).join('');

  /* vibe elements */
  const vibeItems = vd.elements.map(e =>
    `<div class="proportion-rule">
      <div class="pr-dot"></div><span>${e}</span>
    </div>`
  ).join('');

  /* avoids */
  const avoidsHTML = kd.avoids.map(a =>
    `<div class="avoid-item">
      <span class="avoid-x">×</span><span>${a}</span>
    </div>`
  ).join('');

  /* selfie analysis block */
  let selfieHTML = '';
  if (selfieAnalysis) {
    const sa = selfieAnalysis;
    const featuresHTML = (sa.keyFeatures||[]).map(f =>
      `<div class="proportion-rule">
        <div class="pr-dot"></div><span>${f}</span>
      </div>`
    ).join('');
    const selfCelebs = (sa.celebrities||[]).map(c =>
      `<div class="celeb-card" style="margin-bottom:8px">
        <div class="celeb-avatar">${c.name.charAt(0)}</div>
        <div>
          <div class="celeb-name">${c.name}</div>
          <div class="celeb-why">${c.why}</div>
        </div>
      </div>`
    ).join('');
    const makeupCards = (sa.makeupTips||[]).map(t =>
      `<div class="makeup-card">
        <div class="makeup-area">${t.area}</div>
        <div class="makeup-tip">${t.tip}</div>
      </div>`
    ).join('');

    selfieHTML = `
      <div class="selfie-analysis-card">
        ${selfieDataURL
          ? `<img class="selfie-thumb"
              src="${selfieDataURL}" alt="Tu foto">`
          : ''}
        <div class="mb-section-head">
          <div class="mb-section-icon">◉</div>
          <div class="mb-section-title">
            Análisis de tu rostro
          </div>
        </div>
        ${sa.faceShape
          ? `<div class="face-shape-badge">
              Forma de rostro: ${sa.faceShape}
            </div>`
          : ''}
        <div style="margin:12px 0">${featuresHTML}</div>
        <div class="mb-section-head" style="margin-top:14px">
          <div class="mb-section-icon"
            style="background:var(--plum)">✦</div>
          <div class="mb-section-title">
            Referentes con tus rasgos
          </div>
        </div>
        <div style="margin-top:10px">${selfCelebs}</div>
        <div class="mb-section-head" style="margin-top:14px">
          <div class="mb-section-icon"
            style="background:var(--plum)">◐</div>
          <div class="mb-section-title">
            ${isMasc
              ? 'Grooming y maquillaje'
              : 'Técnicas de maquillaje'}
            para tu rostro
          </div>
        </div>
        <div class="makeup-grid"
          style="margin-top:10px">${makeupCards}</div>
        ${sa.styleNote
          ? `<div class="quote-block" style="margin-top:14px">
              ${sa.styleNote}
            </div>`
          : ''}
      </div>`;
  }

  /* Unsplash image search URLs (keyword-based) */
  function unsplashURL(q) {
    const enc = encodeURIComponent(q);
    return `https://source.unsplash.com/400x500/?${enc}`;
  }

  const moodImgs = vd.moodImages || [];
  const mosaicHTML = moodImgs.length >= 3
    ? `<div class="mosaic mosaic-3">
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[0].q)}"
            alt="${moodImgs[0].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[0].cap}</div>
        </div>
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[1].q)}"
            alt="${moodImgs[1].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[1].cap}</div>
        </div>
        <div class="mosaic-item">
          <img src="${unsplashURL(moodImgs[2].q)}"
            alt="${moodImgs[2].cap}" loading="lazy">
          <div class="mosaic-cap">${moodImgs[2].cap}</div>
        </div>
      </div>`
    : '';

  document.getElementById('result-wrap').innerHTML = `

    <!-- COVER -->
    <div class="mb-cover">
      <div class="mb-cover-eyebrow">✦ Tu fórmula VÉNUS</div>
      <div class="mb-cover-name">${vd.name}</div>
      <div class="mb-cover-tagline">${vd.tagline}</div>
      <div class="formula-strip">
        <div class="formula-chip">
          <span class="chip-label">Silueta</span>
          ${kd.name}
        </div>
        <div class="formula-chip">
          <span class="chip-label">Paleta</span>
          ${sd.name}
        </div>
        <div class="formula-chip">
          <span class="chip-label">Vibe</span>
          ${vd.name}
        </div>
      </div>
    </div>

    <!-- SELFIE ANALYSIS (if exists) -->
    ${selfieHTML}

    <!-- SECTION: SILUETA Y PROPORCIONES -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◈</div>
        <div class="mb-section-title">
          Tu silueta — ${kd.name}
        </div>
      </div>
      <div class="proportion-card">
        <div class="proportion-inner">
          <div class="proportion-figure">
            ${kd.svgFigure}
            <div class="proportion-figure-label">
              ${kd.figureDesc}
            </div>
          </div>
          <div class="proportion-rules">
            <div style="font-size:13px;color:#514a4c;
              margin-bottom:10px;line-height:1.5">
              ${kd.desc}
            </div>
            ${propRules}
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION: PRENDAS -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">👗</div>
        <div class="mb-section-title">
          Prendas que te favorecen
        </div>
      </div>
      <div class="garment-grid">${garmentCards}</div>
    </div>

    <!-- SECTION: EVITAR -->
    <div class="avoids-card">
      <div class="avoids-title">Mejor evitar</div>
      ${avoidsHTML}
    </div>

    <!-- SECTION: PALETA -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◐</div>
        <div class="mb-section-title">
          Tu paleta — ${sd.name}
        </div>
      </div>
      <div class="palette-strip">
        <div class="palette-swatches">${swatchHTML}</div>
        ${palRules}
      </div>
    </div>

    <!-- SECTION: MOODBOARD IMAGES -->
    ${mosaicHTML ? `
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">◎</div>
        <div class="mb-section-title">
          Referencias de estilo
        </div>
      </div>
      ${mosaicHTML}
    </div>` : ''}

    <!-- SECTION: ENERGÍA / VIBE -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">☽</div>
        <div class="mb-section-title">
          Tu energía — ${vd.name}
        </div>
      </div>
      <div class="proportion-card">
        <div style="font-size:13px;color:#514a4c;
          line-height:1.5;margin-bottom:12px">
          ${vd.desc}
        </div>
        ${vibeItems}
      </div>
    </div>

    <!-- SECTION: REFERENCIAS CELEBS -->
    <div class="mb-section">
      <div class="mb-section-head">
        <div class="mb-section-icon">✦</div>
        <div class="mb-section-title">
          Referencias con tu silueta
        </div>
      </div>
      <div class="celeb-cards">${celebCards}</div>
    </div>

    <!-- QUOTE -->
    <div class="quote-block">${vd.quote}</div>

    <!-- ACTIONS -->
    <div class="result-actions">
      <a class="btn-home" href="glowup.html" onclick="prepareGlowUp()">
        Continuar con mi Glow Up ✦
      </a>

      <button class="btn-restart" onclick="restart()">
        ← Hacer el test de nuevo
      </button>
      <a class="btn-home" href="index.html">
        Ir a VÉNUS →
      </a>
    </div>
  `;

  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ═══════════════════════════════════════════════════════════
   RESTART
═══════════════════════════════════════════════════════════ */
function prepareGlowUp() {
  // El perfil ya quedó guardado en showMoodboard().
  // Mantener este handler ligero evita depender de parámetros en la URL.
  try {
    const saved = localStorage.getItem('venusGlowUpProfile');
    if (!saved) {
      const kibbe = calcKibbe();
      const season = calcSeason();
      const vibe = calcVibe();
      const kd = KIBBE_DATA[kibbe] || KIBBE_DATA['soft-classic'];
      const sd = SEASON_DATA[season] || SEASON_DATA['autumn-soft'];
      const vd = VIBE_DATA[vibe] || VIBE_DATA['romantic-mystery'];
      localStorage.setItem('venusGlowUpProfile', JSON.stringify({
        version: 1, gender, kibbe: kd.name, season: sd.name, vibe: vd.name,
        formula: `${kd.name} · ${sd.name} · ${vd.name}`,
        createdAt: new Date().toISOString()
      }));
    }
  } catch (e) {}
}

function restart() {
  modIdx = 0; qIdx = 0;
  gender = null;
  selfieDataURL  = null;
  selfieAnalysis = null;
  Object.keys(answers).forEach(k => delete answers[k]);

  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('selfie-wrap').style.display = 'none';
  document.getElementById('quiz-wrap').style.display   = 'none';
  document.getElementById('gender-screen').style.display = 'block';

  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-pct').textContent  = '0%';
  document.getElementById('prog-label').textContent = 'Elige tu perfil';
  for (let i=0; i<4; i++) {
    const el = document.getElementById('sd'+i);
    if (el) el.className = 'section-dot'+(i===0?' active':'');
  }
  renderGenderScreen();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ── START ─────────────────────────────────────────────── */
renderGenderScreen();
</script>
