/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --wine:   #641f38;
  --plum:   #40203f;
  --wine-lt:#fdf0f4;
  --wine-md:#e8b0c0;
  --gold:   #c9a66b;
  --cream:  #f6f0e8;
  --black:  #171516;
  --white:  #fffaf6;
  --muted:  #7a6e70;
  --border: rgba(23,21,22,.12);
  --r:      14px;
}

/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
